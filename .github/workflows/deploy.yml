name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write # necessário para o login OIDC no Azure, sem senha no repositório

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # github.repository é Marcos-Ferreira-cbf/luanaemarcos, com maiúsculas.
      # Nome de imagem Docker é minúsculo por especificação, e o push falha
      # com "repository name must be lowercase" antes de qualquer outra coisa.
      - name: Nome da imagem
        id: img
        run: echo "nome=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.img.outputs.nome }}:latest
            ${{ steps.img.outputs.nome }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Login no Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Na primeira execução o Container App ainda não existe — é justamente
      # esta imagem que faltava para o Bicep poder criá-lo. Sem o guarda, o
      # job que publicou a imagem certa terminaria vermelho.
      - name: Nova revisão no Container Apps
        run: |
          if az containerapp show -g rg-casamento-luanaemarcos -n ca-casamento -o none 2>/dev/null; then
            az containerapp update \
              -g rg-casamento-luanaemarcos \
              -n ca-casamento \
              --image ${{ steps.img.outputs.nome }}:${{ github.sha }}
          else
            echo "::notice::Container App ainda não existe. Imagem publicada; rode o Bicep uma vez com implantarApp=true e imagem=${{ steps.img.outputs.nome }}:${{ github.sha }}"
          fi
